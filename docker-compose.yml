version: '3.8'

services:
  # PHP FPM Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railsync_app
    restart: unless-stopped
    working_dir: /app
    environment:
      - APP_NAME=RailSync
      - APP_ENV=testing
      - APP_KEY=base64:key+base64/encoded/testing/key==
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=railsync_test
      - DB_USERNAME=railsync
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
    volumes:
      - ./:/app
      - ./docker/php.ini:/usr/local/etc/php/conf.d/app.ini
    ports:
      - "9000:9000"
    depends_on:
      - mysql
      - redis
    networks:
      - railsync_network
    command: php-fpm

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: railsync_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - railsync_network

  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: railsync_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: railsync_test
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: railsync
      MYSQL_ALLOW_EMPTY_PASSWORD: 'false'
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      retries: 3
      timeout: 5s
    networks:
      - railsync_network

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: railsync_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s
    networks:
      - railsync_network

  # Testing Service
  testing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railsync_testing
    working_dir: /app
    environment:
      - APP_NAME=RailSync
      - APP_ENV=testing
      - APP_KEY=base64:key+base64/encoded/testing/key==
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=railsync_test
      - DB_USERNAME=railsync
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    volumes:
      - ./:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - railsync_network
    command: sh -c "php artisan migrate:fresh && vendor/bin/phpunit -c phpunit.docker.xml --colors"

networks:
  railsync_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
